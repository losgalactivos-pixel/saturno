<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; frame-src https://www.openstreetmap.org; connect-src 'self' https://nominatim.openstreetmap.org https://overpass-api.de https://overpass.private.coffee https://overpass.kumi.systems; base-uri 'none'; form-action 'self'">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>Saturno · Negocios sin web</title>
  <meta name="description" content="Encuentra negocios locales con teléfono y sin página web en OpenStreetMap, y organiza tus llamadas comerciales.">
  <meta name="theme-color" content="#790DD6">
  <meta name="color-scheme" content="light">
  <link rel="icon" href="favicon.ico" sizes="32x32">
  <link rel="icon" href="icons/saturno.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="css/app.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <div class="splash" id="splash" aria-hidden="true" hidden>
    <div class="splash-stage">
      <span class="splash-spark" style="--x:-118px; --y:-64px; --s:10px; --d:380ms"></span>
      <span class="splash-spark" style="--x:104px; --y:-92px; --s:7px; --d:560ms"></span>
      <span class="splash-spark" style="--x:132px; --y:18px; --s:12px; --d:720ms"></span>
      <span class="splash-spark" style="--x:-96px; --y:52px; --s:6px; --d:860ms"></span>
      <span class="splash-spark" style="--x:-30px; --y:-124px; --s:5px; --d:1000ms"></span>
      <span class="splash-spark" style="--x:60px; --y:84px; --s:8px; --d:1120ms"></span>
      <svg class="splash-logo" viewBox="0 0 64 64" width="136" height="136">
        <defs>
          <radialGradient id="sp-shine" cx="0.32" cy="0.26" r="0.75">
            <stop offset="0" stop-color="#fff" stop-opacity="0.34"/>
            <stop offset="0.6" stop-color="#fff" stop-opacity="0"/>
          </radialGradient>
          <mask id="sp-gap" maskUnits="userSpaceOnUse" x="-16" y="-16" width="96" height="96">
            <rect x="-16" y="-16" width="96" height="96" fill="#fff"/>
            <path class="sp-ring-front" d="M5 32a27 8.5 0 0 0 54 0" transform="rotate(-24 32 32)" pathLength="100" fill="none" stroke="#000" stroke-width="10" stroke-linecap="round"/>
          </mask>
        </defs>
        <circle class="sp-pulse" cx="32" cy="32" r="16.5" fill="none" stroke="#790DD6" stroke-width="1"/>
        <g class="sp-tilt">
          <path class="sp-ring-back" d="M5 32a27 8.5 0 0 1 54 0" transform="rotate(-24 32 32)" pathLength="100" fill="none" stroke="#790DD6" stroke-width="4.6" stroke-linecap="round"/>
          <g mask="url(#sp-gap)">
            <g class="sp-planet">
              <circle cx="32" cy="32" r="16.5" fill="#790DD6"/>
              <circle class="sp-shine" cx="32" cy="32" r="16.5" fill="url(#sp-shine)"/>
            </g>
          </g>
          <path class="sp-ring-front" d="M5 32a27 8.5 0 0 0 54 0" transform="rotate(-24 32 32)" pathLength="100" fill="none" stroke="#790DD6" stroke-width="4.6" stroke-linecap="round"/>
        </g>
        <path class="sp-star" d="M54 8.5l1.1 3.4 3.4 1.1-3.4 1.1-1.1 3.4-1.1-3.4-3.4-1.1 3.4-1.1z" fill="#790DD6"/>
      </svg>
      <p class="splash-name">Saturno</p>
      <p class="splash-tag">Negocios sin web</p>
    </div>
  </div>
  <script src="js/splash.js"></script>

  <a class="skip-link" href="#main">Saltar al contenido</a>

  <header class="topbar">
    <button class="icon-btn" type="button" id="menu-btn" aria-label="Abrir ciudades" aria-controls="sidebar" aria-expanded="false"></button>
    <a class="brand brand-compact" href="#/">
      <img src="icons/saturno.svg" alt="" width="28" height="28">
      <span>Saturno</span>
    </a>
    <a class="icon-btn" href="#/seguimiento" id="topbar-tracking" aria-label="Seguimiento"></a>
  </header>

  <aside id="sidebar" class="sidebar" aria-label="Navegación y ciudades"></aside>
  <div class="scrim" id="scrim" hidden></div>

  <main id="main" class="main" tabindex="-1">
    <div class="boot" aria-live="polite">
      <img src="icons/saturno.svg" alt="" width="56" height="56" class="boot-logo">
      <p>Cargando Saturno…</p>
    </div>
  </main>

  <dialog id="detail" class="detail" aria-labelledby="detail-title"></dialog>
  <div id="toasts" class="toasts" role="status" aria-live="polite"></div>

  <noscript>
    <p class="noscript">Saturno necesita JavaScript activado para funcionar.</p>
  </noscript>
</body>
</html>
